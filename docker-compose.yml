services:

  postgres:
    image: postgres:17
    container_name: ecommerce-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    # Local only. In production do not publish 5433 — only expose api :3000.
    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_multi_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

    restart: unless-stopped


  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}

    # Local only: published so host workers (`npm run start:*-ms`) can connect.
    # In production do not publish 6379 — keep Redis on the private network.
    ports:
      - "6379:6379"

    restart: unless-stopped


  kafka:
    image: apache/kafka:3.8.0
    container_name: ecommerce-kafka
    hostname: kafka

    # Local only. In production do not publish 9092 — keep Kafka off the public network.
    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    restart: unless-stopped


  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder

    container_name: ecommerce-migrate

    command: ["npm", "run", "migration:run"]

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_API: ecommerce_api
      DB_DATABASE_PRODUCTS: ecommerce_products
      DB_DATABASE_ORDERS: ecommerce_orders
      DB_DATABASE_PAYMENTS: ecommerce_payments

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ecommerce-api

    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_API: ecommerce_api
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-60}
      INTERNAL_RPC_SECRET: ${INTERNAL_RPC_SECRET}

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped


  product-ms:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ecommerce-product-ms

    command: ["node", "dist/microservices/product/product.microservice.js"]

    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_PRODUCTS: ecommerce_products
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BROKERS: kafka:29092
      INTERNAL_RPC_SECRET: ${INTERNAL_RPC_SECRET}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped


  order-ms:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ecommerce-order-ms

    command: ["node", "dist/microservices/orders/orders.microservice.js"]

    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_ORDERS: ecommerce_orders
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BROKERS: kafka:29092
      INTERNAL_RPC_SECRET: ${INTERNAL_RPC_SECRET}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped


  payment-ms:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ecommerce-payment-ms

    command: ["node", "dist/microservices/payments/payments.microservice.js"]

    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_PAYMENTS: ecommerce_payments
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BROKERS: kafka:29092
      INTERNAL_RPC_SECRET: ${INTERNAL_RPC_SECRET}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped


  notifications-ms:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ecommerce-notifications-ms

    command: ["node", "dist/microservices/notifications/notifications.microservice.js"]

    environment:
      NODE_ENV: production
      KAFKA_BROKERS: kafka:29092

    depends_on:
      kafka:
        condition: service_started

    restart: unless-stopped


  pgadmin:
    image: dpage/pgadmin4
    container_name: ecommerce-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      - postgres

    restart: unless-stopped


volumes:
  postgres_multi_data:
